<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave &amp; Wheel</title>
<style>
  :root { --bg: #0f0f13; --panel: #1b1b22; --ink: #e8e6e1; --mute: #8a8892; --accent: #ffcf5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #26262e; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: 0.02em; }
  button { font: inherit; color: var(--ink); background: #26262f; border: 1px solid #34343f; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .bpm { display: flex; gap: 4px; align-items: center; color: var(--mute); }
  .bpm b { color: var(--ink); min-width: 2.5em; text-align: center; }
  #pad { margin-left: auto; color: var(--mute); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .stage-wrap { position: relative; min-height: 0; min-width: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  aside { background: var(--panel); border-left: 1px solid #26262e; display: flex; flex-direction: column; min-height: 0; }
  #panel-title { padding: 12px 14px 8px; font-weight: 700; }
  #panel { overflow-y: auto; padding: 0 8px 12px; }
  .row { display: grid; grid-template-columns: 24px 1fr auto 24px; align-items: center; gap: 4px; padding: 4px 4px; border-radius: 6px; cursor: pointer; }
  .row.global { opacity: 0.8; }
  .row.global:first-of-type, .row:not(.global) + .row.global { margin-top: 10px; border-top: 1px solid #2c2c36; padding-top: 8px; }
  .row.sel { background: #2e2e3a; outline: 1px solid var(--accent); }
  .row.dim { opacity: 0.35; }
  .row .value { font-variant-numeric: tabular-nums; color: var(--accent); }
  .row .nudge { padding: 0; width: 22px; height: 22px; font-size: 10px; background: transparent; border-color: transparent; color: var(--mute); }
  .row.sel .nudge { color: var(--ink); }
  footer { padding: 8px 16px; color: var(--mute); font-size: 12px; border-top: 1px solid #26262e; }
  footer b { color: var(--ink); font-weight: 600; }
  .keys { opacity: 0.7; }
  [hidden] { display: none !important; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,10,14,0.82); cursor: pointer; z-index: 5; }
  #overlay div { text-align: center; }
  #overlay h2 { margin: 0 0 6px; font-size: 22px; }
  #overlay p { color: var(--mute); margin: 0; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
    aside { border-left: 0; border-top: 1px solid #26262e; }
  }
</style>
</head>
<body>
<header>
  <h1>Wave &amp; Wheel</h1>
  <div class="tabs">
    <button data-mode="wave">∿ Wave</button>
    <button data-mode="wheel">◎ Wheel</button>
  </div>
  <button id="play">▶ Play</button>
  <div class="bpm"><button id="bpm-down">−</button><b id="bpm">96</b><button id="bpm-up">+</button> bpm</div>
  <span id="pad"></span>
</header>
<main>
  <div class="stage-wrap"><canvas id="stage"></canvas></div>
  <aside>
    <div id="panel-title"></div>
    <div id="panel"></div>
  </aside>
</main>
<footer id="help"></footer>
<div id="overlay"><div><h2>Wave &amp; Wheel</h2><p>Click or press a key to start audio. Then press Start or Enter to play.</p></div></div>
<script src="../common/input.js"></script>
<script src="../common/kit.js"></script>
<script src="app.js"></script>
</body>
</html>
